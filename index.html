<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JanSamvaad API Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16232b;--muted:#5d6b73;--line:#d9e0e4;--bg:#f4f6f7;--panel:#fff;--teal:#0f5c6e;--teal-d:#0a4553;--saffron:#d9820b;--ok:#1f7a3d;--okbg:#e5f4ea;--err:#b3261e;--errbg:#fbe9e7;--code:#10202a;--codefg:#d6e4ea;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--ink:#e4edf1;--muted:#93a3ac;--line:#2a3a43;--bg:#0f1a20;--panel:#16252d;--teal:#4cb5cc;--teal-d:#6fc9dd;--saffron:#f0a53a;--ok:#5fd183;--okbg:#14301f;--err:#ff8b82;--errbg:#3a1a18;--code:#0b141a}}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.5 var(--sans);color:var(--ink);background:var(--bg);padding-top:env(safe-area-inset-top,0)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:600}header h1 span{color:var(--saffron)}
.cfg{display:flex;flex:1;gap:10px;min-width:260px;flex-wrap:wrap;align-items:center}
.cfg label{font-size:12px;color:var(--muted)}
.cfg input[type=text]{flex:1;min-width:220px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--mono);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--teal);color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}.btn.primary:hover{background:var(--teal-d)}
.btn:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:10px 0}
nav button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;padding:9px 16px;border:0;border-left:3px solid transparent;background:none;cursor:pointer}
nav button:hover{background:var(--bg)}nav button[aria-current=true]{background:var(--bg);border-left-color:var(--saffron);font-weight:500}
nav .p{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.m{font:600 10px var(--mono);background:var(--teal);color:#fff;border-radius:4px;padding:2px 5px}
.lock{margin-left:auto;font-size:11px;color:var(--saffron)}
nav hr{border:0;border-top:1px solid var(--line);margin:8px 0}
main{padding:22px 26px;max-width:980px;width:100%}
h2{margin:0 0 4px;font-size:20px}h3{margin:22px 0 8px;font-size:14px}
.url{font:13px var(--mono);color:var(--muted);word-break:break-all}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--saffron);padding:9px 12px;border-radius:6px;margin:12px 0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
textarea{width:100%;background:var(--code);color:var(--codefg);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.5 var(--mono);resize:vertical;min-height:90px}
select,.auth input{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.auth input{font-family:var(--mono);font-size:13px;min-width:0}
pre{margin:0;background:var(--code);color:var(--codefg);padding:12px;border-radius:6px;overflow:auto;font:13px/1.5 var(--mono);max-height:420px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--bg);padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font:500 12px var(--mono);padding:2px 8px;border-radius:999px}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.err{background:var(--errbg);color:var(--err)}.tag.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
ul.msgs{margin:0;padding-left:18px}ul.msgs li{margin:2px 0;font-family:var(--mono);font-size:12.5px}
.k{color:#8fd0e0}.s{color:#b5e0a3}.n{color:#f0c27a}
@media(max-width:800px){.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:0}nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav button[aria-current=true]{border-bottom-color:var(--saffron)}nav hr{display:none}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>JanSamvaad <span>API Console</span></h1>
  <div class="cfg">
    <label for="base">Base URL</label>
    <input type="text" id="base" spellcheck="false" placeholder="https://api.example.com/mobile_api/">
    <label id="viaLbl">Send via</label>
    <div class="seg" id="via" role="group" aria-labelledby="viaLbl"><button data-v="proxy" title="Server-side request through /api/proxy. No CORS limits.">Proxy</button><button data-v="direct" title="Browser calls the API directly. The API must allow CORS.">Direct</button></div>
  </div>
</header>
<div class="layout">
  <nav id="nav" aria-label="Endpoints"></nav>
  <main id="main"></main>
</div>

<script>
/* ---------- API definition (from JanSamvaad Mobile App Documentation) ---------- */
const COMMON = {
  title: 'Common responses',
  items: [
    ['"status": "0"', 'Failure response'], ['"status": "1"', 'Success response'],
    ['Invalid Request', 'Request method is wrong. Use POST.'],
    ['Invalid Data', 'Check the posted JSON for required parameters.'],
    ['token_invalid', 'Token not posted correctly. Check the bearer_token header.'],
    ['token_expired', 'Posted token does not match the current token. Log the user out or show the login screen.']
  ],
  bearer: 'Protected APIs need a bearer_token header built from the Verify OTP response: {primary_id}||{access_token}. Example: primary_id 1 and access_token abcxyz gives 1||abcxyz.'
};
const REG = 'CMOFF/J/2026/123456', MOB = '9041062580';
const GRV = { regno: REG, name: 'TEST TEST', district_name: '', department_name: '', subjectdetails: '1. गली से अवैध रैंप हटवाने बारे।', registration_date: '2024-01-03', current_status: 'Resolved', current_user: 'ABC ANC', grv_attachment: '', latest_atr: '' };
const DEFAULTS = [
 { path:'send_otp.php', title:'Send OTP', protected:false,
   desc:'Sends an OTP by SMS. Use type "send" for the first attempt and "resend" for a retry. send_type says which identifiers are passed: both, mobile or regno.',
   variants:{ 'both':{send_type:'both',mobile:MOB,regno:REG,type:'send'}, 'mobile only':{send_type:'mobile',mobile:MOB,type:'send'}, 'regno only':{send_type:'regno',regno:REG,type:'send'} },
   responses:{ success:{status:'1',message:'Request for OTP SMS successful.',send_type:'both',mobile:MOB,regno:REG}, failure:{status:'0',message:'Something went wrong. Cannot send OTP. Try again.',send_type:'both',mobile:MOB,regno:REG} },
   successMsgs:['Request for OTP SMS successful.','Request for Resend OTP SMS successful.'],
   failureMsgs:["Something went wrong. Can't send OTP. Try again.",'No Grievance found for provided Mobile Number','No Grievance found for provided Mobile Number and Grievance Number','No Grievance found for provided Grievance Number','you are blocked for 1 hour'] },
 { path:'verify_otp.php', title:'Verify OTP', protected:false, capturesToken:true,
   desc:'Verifies the OTP. On success it returns primary_id and access_token. This console saves them automatically and uses them for protected endpoints.',
   variants:{ 'both':{send_type:'both',mobile:MOB,regno:REG,type:'send',otp:1234}, 'mobile only':{send_type:'mobile',mobile:MOB,type:'send',otp:1234}, 'regno only':{send_type:'regno',regno:REG,type:'send',otp:1234} },
   responses:{ success:{status:'1',message:'Registered Successfully',primary_id:'7',access_token:'wlxgc0vdkp90j3oucfdn3efsx8o7jrqh5veigy3s03d0b9qgjm',data:{registration_number:REG,name:'Test (Monu)',district_name:'',department_name:'',subject_details:'1. गली से अवैध रैंप हटवाने बारे।',registration_date:'2024-01-03',current_status:'In-Process',current_user:'Revenue',grv_attachment:'',latest_atr:''}}, failure:{status:'0',message:'Invalid request method.'} },
   failureMsgs:['Invalid request method.','Invalid request data.','Invalid JSON data.','Invalid data.','Unable to process your request.','Service temporarily unavailable.','Unable to verify OTP at this time.','Unable to verify OTP.','Unable to complete registration.','Registration could not be completed.'] },
 { path:'fetch_grievance_list.php', title:'Fetch grievance list', protected:true,
   desc:'Lists the grievances registered against a mobile number.',
   variants:{ 'default':{mobile:MOB} },
   responses:{ success:{status:'1',message:'Success',data:{0:{regno:'CMOFF/J/2026/002442',subjectdetails:'Please Enter Specific Details about Your Grievance here'},1:{regno:'CMOFF/J/2026/002450',subjectdetails:'Please Enter Specific Details about Your Grievance here'}}} } },
 { path:'fetch_grievance_details.php', title:'Fetch grievance details', protected:true,
   desc:'Returns the full details of one grievance.',
   variants:{ 'regno only':{send_type:'regno',regno:REG}, 'regno + mobile':{send_type:'both',regno:REG,mobile:MOB} },
   responses:{ success:{status:'1',message:'Success',data:GRV} } },
 { path:'fetch_grievance_history.php', title:'Fetch grievance history', protected:true,
   desc:'Returns the movement history of a grievance, newest first.',
   variants:{ 'default':{regno:REG} },
   responses:{ success:{status:'1',message:'Success',data:{0:{regno:REG,from_user:'ABC ABC',to_user:'TEST TEST',actiondate:'2024-06-27',remarks:'Dispose off'},1:{regno:REG,from_user:'ABC ABC',to_user:'TEST TEST',actiondate:'2024-05-18',remarks:'Please file the ATR for further action'}}} } },
 { path:'take_feedback.php', title:'Take feedback', protected:true,
   desc:'Saves the citizen\'s feedback remarks for a grievance.',
   variants:{ 'default':{regno:REG,feedback_remarks:'this is test remarks'} },
   responses:{ success:{status:'1',message:'Success'}, failure:{status:'0',message:'Data Not Captured.'} } }
];

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const store = { get:(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}} };
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => 'e'+Math.random().toString(36).slice(2,8);
function loadEps(){ try{ const a=JSON.parse(store.get('eps','')); if(Array.isArray(a)&&a.length) return a }catch{} return clone(DEFAULTS) }
let ENDPOINTS = loadEps();
function normalize(){ ENDPOINTS.forEach(e=>{ e.id=e.id||uid(); if(!e.variants||!Object.keys(e.variants).length) e.variants={default:{}}; e.responses=e.responses||{}; e.responses.success=e.responses.success||{}; e.responses.failure=e.responses.failure||{}; }) }
normalize();
const saveEps = () => store.set('eps',JSON.stringify(ENDPOINTS));
const st = { base:store.get('base','https://10.10.100.10/mobile_api/'), pid:store.get('pid',''), tok:store.get('tok',''), cur:'common', last:null };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = j => esc(j).replace(/(&quot;|")([^"\n]*?)\1(\s*:)?|\b(-?\d+\.?\d*)\b/g,(m,q,t,colon,num)=> num!==undefined?`<span class="n">${m}</span>`: colon?`<span class="k">${m.slice(0,-colon.length)}</span>${colon}`:`<span class="s">${m}</span>`);
const pretty = o => JSON.stringify(o,null,2);
const bearer = () => st.pid && st.tok ? `${st.pid}||${st.tok}` : '';
const curEp = () => ENDPOINTS.find(e=>e.id===st.cur);
const fullUrl = ep => /^https?:\/\//i.test(ep.path||'') ? ep.path : st.base.replace(/\/+$/,'')+'/'+(ep.path||'').replace(/^\/+/,'');
function refreshUrl(){const u=$('url'),ep=curEp();if(u&&ep)u.textContent=fullUrl(ep)}

$('base').value = st.base;
$('base').addEventListener('input',e=>{st.base=e.target.value.trim();store.set('base',st.base);refreshUrl()});
/* The proxy only exists when this page is served by Vercel, not when opened as a local file. */
const canProxy = /^https?:$/.test(location.protocol);
st.via = canProxy ? store.get('via','proxy') : 'direct';
function paintVia(){$('via').querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===st.via);b.disabled=!canProxy&&b.dataset.v==='proxy'})}
$('via').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.via=b.dataset.v;store.set('via',st.via);paintVia()});
paintVia();

/* ---------- navigation ---------- */
function buildNav(){
  $('nav').innerHTML = `<button data-id="common" aria-current="${st.cur==='common'}"><span>Overview</span></button><hr>` +
    ENDPOINTS.map(e=>`<button data-id="${e.id}" aria-current="${st.cur===e.id}"><span class="m">POST</span><span class="p">${esc(e.path||'(no path)')}</span>${e.protected?'<span class="lock" title="Sends bearer_token">protected</span>':''}</button>`).join('') +
    `<hr><button id="addEp"><span class="p">+ Add endpoint</span></button>`;
  $('nav').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{st.cur=b.dataset.id;buildNav();render()});
  $('addEp').onclick=()=>{const e={id:uid(),path:'new_endpoint.php',title:'New endpoint',protected:false,desc:'',variants:{default:{}},responses:{success:{},failure:{}}};ENDPOINTS.push(e);saveEps();st.cur=e.id;buildNav();render();$('path').select()};
}

/* ---------- endpoint view ---------- */
function render(){
  if(st.cur==='common') return renderCommon();
  const ep=curEp(); if(!ep){st.cur='common';buildNav();return renderCommon()}
  st.last=null;
  $('main').innerHTML = `
    <div class="auth"><input id="title" value="${esc(ep.title||'')}" placeholder="Endpoint name" aria-label="Endpoint name" style="width:100%;font-size:20px;font-weight:600;border-color:transparent;background:transparent"></div>
    <div class="row auth" style="margin-top:6px"><span class="m">POST</span><input id="path" value="${esc(ep.path||'')}" placeholder="send_otp.php" size="30" aria-label="Endpoint path">
      <label><input type="checkbox" id="prot" ${ep.protected?'checked':''}> Protected (sends bearer_token)</label><button class="btn" id="del">Remove endpoint</button></div>
    <div class="url" id="url"></div>
    <div class="auth" style="margin-top:8px"><input id="desc" value="${esc(ep.desc||'')}" placeholder="What does this endpoint do?" aria-label="Description" style="width:100%"></div>
    <div class="card">
      <h3 style="margin-top:0">Try it</h3>
      ${ep.protected?`<div class="note" id="authnote"></div>`:''}
      <label for="hdrs"><b>Headers</b></label>
      <textarea id="hdrs" rows="3" spellcheck="false"></textarea>
      <div class="row" style="margin-top:12px"><label for="variant"><b>Payload</b></label><select id="variant"></select>
        <button class="btn" id="saveVar">Save as example</button><button class="btn" id="delVar">Delete example</button></div>
      <textarea id="body" rows="7" spellcheck="false"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="send">Send request</button><span id="meta"></span></div>
      <pre id="out" hidden></pre>
    </div>
    <h3>Documented responses</h3>
    <div class="card" style="margin-top:0">
      <div class="tabs" id="rtabs"><button data-k="success" aria-pressed="true">Success</button><button data-k="failure" aria-pressed="false">Failure</button></div>
      <textarea id="docresp" rows="8" spellcheck="false" aria-label="Documented response JSON"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="useLast" hidden></button><span class="url" id="docmsg"></span></div>
      ${ep.successMsgs?`<h3>Success messages</h3><ul class="msgs">${ep.successMsgs.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}
      ${ep.failureMsgs?`<h3>Failure messages</h3><ul class="msgs">${ep.failureMsgs.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}
    </div>`;
  refreshUrl();
  const upd=()=>{saveEps();buildNav();refreshUrl()};
  $('title').oninput=e=>{ep.title=e.target.value;saveEps()};
  $('path').oninput=e=>{ep.path=e.target.value.trim();upd()};
  $('prot').onchange=e=>{ep.protected=e.target.checked;saveEps();buildNav();render()};
  $('desc').oninput=e=>{ep.desc=e.target.value;saveEps()};
  $('del').onclick=()=>{if(!confirm('Remove this endpoint?'))return;ENDPOINTS=ENDPOINTS.filter(x=>x!==ep);saveEps();st.cur='common';buildNav();render()};
  /* payload examples */
  const sel=$('variant');
  const fillBody=()=>{$('body').value=pretty(ep.variants[sel.value]||{})};
  const fillSel=name=>{sel.innerHTML=Object.keys(ep.variants).map(k=>`<option>${esc(k)}</option>`).join('');if(name)sel.value=name;fillBody()};
  sel.onchange=fillBody;fillSel();
  $('saveVar').onclick=()=>{const name=prompt('Example name',sel.value);if(!name)return;let o;try{o=JSON.parse($('body').value)}catch{return alert('Payload is not valid JSON.')}ep.variants[name]=o;saveEps();fillSel(name)};
  $('delVar').onclick=()=>{if(Object.keys(ep.variants).length<2)return alert('Keep at least one example.');delete ep.variants[sel.value];saveEps();fillSel()};
  /* documented responses */
  let tab='success';
  const showDoc=()=>{$('docresp').value=pretty(ep.responses[tab]);$('rtabs').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===tab));$('useLast').textContent=`Save last live response as ${tab}`;$('docmsg').textContent=''};
  $('rtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;showDoc()});
  $('docresp').oninput=e=>{try{ep.responses[tab]=JSON.parse(e.target.value);saveEps();$('docmsg').textContent='Saved'}catch{$('docmsg').textContent='Not valid JSON yet, not saved'}};
  $('useLast').onclick=()=>{if(!st.last)return;ep.responses[tab]=st.last;saveEps();showDoc();$('docmsg').textContent='Saved'};
  showDoc();fillHeaders(ep);$('send').onclick=()=>send(ep);
}
function fillHeaders(ep){
  const h={'Content-Type':'application/json'}; if(ep.protected) h.bearer_token=bearer()||'<run Verify OTP first>';
  $('hdrs').value=pretty(h);
  const n=$('authnote'); if(n) n.textContent = bearer()?'bearer_token is filled from your saved login.':'No saved token yet. Call the Verify OTP endpoint once, or save a token on the Overview page.';
}

/* ---------- overview ---------- */
function renderCommon(){
  $('main').innerHTML = `<h2>${COMMON.title}</h2>
    <p>Set the base URL at the top, then edit, add or remove endpoints from the sidebar. Every request is sent as POST with JSON.</p>
    <div class="card"><ul class="msgs">${COMMON.items.map(([a,b])=>`<li><b>${esc(a)}</b>: ${esc(b)}</li>`).join('')}</ul></div>
    <div class="note">${esc(COMMON.bearer)}</div>
    <div class="card"><h3 style="margin-top:0">Saved login</h3>
      <div class="row auth"><input id="pid" placeholder="primary_id" value="${esc(st.pid)}" size="10" aria-label="primary_id"><input id="tok" placeholder="access_token" value="${esc(st.tok)}" size="40" aria-label="access_token">
      <button class="btn" id="saveAuth">Save</button><button class="btn" id="clearAuth">Clear</button></div>
      <div class="url">bearer_token: <span id="bt">${esc(bearer()||'not set')}</span></div></div>
    <div class="card"><h3 style="margin-top:0">Endpoints data</h3>
      <p style="margin-top:0;color:var(--muted)">Endpoints are saved in this browser. Export them to share with a teammate or move to another browser.</p>
      <div class="row"><button class="btn" id="exp">Export JSON</button><button class="btn" id="impBtn">Import JSON</button><input type="file" id="imp" accept=".json,application/json" hidden><button class="btn" id="reset">Reset to the 6 JanSamvaad endpoints</button></div></div>`;
  $('saveAuth').onclick=()=>{st.pid=$('pid').value.trim();st.tok=$('tok').value.trim();store.set('pid',st.pid);store.set('tok',st.tok);$('bt').textContent=bearer()||'not set'};
  $('clearAuth').onclick=()=>{st.pid=st.tok='';store.set('pid','');store.set('tok','');renderCommon()};
  $('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pretty(ENDPOINTS)],{type:'application/json'}));a.download='endpoints.json';a.click()};
  $('impBtn').onclick=()=>$('imp').click();
  $('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const a=JSON.parse(await f.text());if(!Array.isArray(a)||!a.length)throw 0;ENDPOINTS=a;normalize();saveEps();buildNav();renderCommon()}catch{alert('That file is not a valid endpoints JSON.')}};
  $('reset').onclick=()=>{if(!confirm('Replace all endpoints with the 6 defaults?'))return;ENDPOINTS=clone(DEFAULTS);normalize();saveEps();buildNav();renderCommon()};
}

/* ---------- send ---------- */
async function send(ep){
  const out=$('out'),meta=$('meta'),btn=$('send');
  let headers,body;
  const fail=m=>{out.hidden=false;out.textContent=m;meta.innerHTML='<span class="tag err">not sent</span>'};
  try{headers=JSON.parse($('hdrs').value)}catch{return fail('Headers are not valid JSON.')}
  try{body=JSON.stringify(JSON.parse($('body').value))}catch{return fail('Payload is not valid JSON.')}
  if(!st.base&&!/^https?:\/\//i.test(ep.path||''))return fail('Enter a base URL at the top first.');
  const url=fullUrl(ep);btn.disabled=true;btn.textContent='Sending…';meta.innerHTML='';
  const t0=performance.now();let status,text;
  if(st.via==='proxy'){
    try{
      const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,headers,body})});
      const p=await r.json().catch(()=>({error:`Proxy returned HTTP ${r.status}. Is this page deployed on Vercel with api/proxy.js?`}));
      if(p.error)throw new Error(p.error);
      status=p.status;text=p.text;
    }catch(e){
      btn.disabled=false;btn.textContent='Send request';
      return fail(`Proxy request failed: ${e.message}`);
    }
  }
  else try{const r=await fetch(url,{method:'POST',headers,body});status=r.status;text=await r.text()}
  catch(e){
    btn.disabled=false;btn.textContent='Send request';
    return fail(`Request failed: ${e.message}\n\nSwitch "Send via" to Proxy to avoid browser CORS limits.\n\nCommon causes:\n- The server does not allow cross-origin requests (CORS). It must allow this site's origin and the headers you send, such as bearer_token.\n- The base URL starts with http:// but this site is https://. Browsers block that. Use an https:// API.\n- The certificate is not trusted. Open the base URL in a new tab and accept it.\n- The address is private (10.x.x.x) and your device is not on that network.`);
  }
  const ms=Math.round(performance.now()-t0);btn.disabled=false;btn.textContent='Send request';
  let parsed=null;try{parsed=JSON.parse(text)}catch{}
  const apiOk=parsed&&String(parsed.status)==='1';
  meta.innerHTML=`<span class="tag ${status<400?'ok':'err'}">HTTP ${status}</span> `+(parsed?`<span class="tag ${apiOk?'ok':'err'}">status ${esc(parsed.status)}</span> `:'<span class="tag n">not JSON</span> ')+`<span class="tag n">${ms} ms</span>`;
  out.hidden=false;out.innerHTML=parsed?hl(pretty(parsed)):esc(text);
  if(parsed&&typeof parsed==='object'){st.last=parsed;$('useLast').hidden=false}
  if(apiOk&&parsed.primary_id&&parsed.access_token){
    st.pid=String(parsed.primary_id);st.tok=parsed.access_token;store.set('pid',st.pid);store.set('tok',st.tok);
    meta.innerHTML+=' <span class="tag ok">login saved</span>';
  }
}

buildNav();render();
</script>
</body>
</html>
